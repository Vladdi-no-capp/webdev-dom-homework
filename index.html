<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div class="comment-author">Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div class="comment-author">Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>


  <script>
  "use strict";

  const button = document.querySelector(".add-form-button");
  const placeholderText = document.querySelector(".add-form-text");
  const placeholderName = document.querySelector(".add-form-name");
  const comments = document.querySelector(".comments");

  const sanitizeHtml = (value) => {
    return value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  };

  button.addEventListener("click", () => {
    const name = placeholderName.value.trim();
    const text = placeholderText.value.trim();

    if (name === "" || text === "") {
      return;
    }

    const safeName = sanitizeHtml(name);
    const safeText = sanitizeHtml(text);

    const now = new Date();

    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = String(now.getFullYear()).slice(-2);
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");

    const formattedDate =
      `${day}.${month}.${year} ${hours}:${minutes}`;

    comments.insertAdjacentHTML(
      "beforeend",
      `
        <li class="comment">
          <div class="comment-header">
            <div class="comment-author">${safeName}</div>
            <div>${formattedDate}</div>
          </div>

          <div class="comment-body">
            <div class="comment-text">${safeText}</div>
          </div>

          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">0</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
      `,
    );

    placeholderName.value = "";
    placeholderText.value = "";
  });

  comments.addEventListener("click", (event) => {
    const likeButton = event.target.closest(".like-button");

    if (likeButton) {
      event.stopPropagation();

      const counter = likeButton.querySelector(
        ".likes-counter",
      ) || likeButton.previousElementSibling;

      const currentCount = Number(counter.textContent);
      const isLiked =
        likeButton.classList.toggle("-active-like");

      if (isLiked) {
        counter.textContent = currentCount + 1;
      } else {
        counter.textContent = currentCount - 1;
      }

      return;
    }

    const comment = event.target.closest(".comment");

    if (!comment) {
      return;
    }

    const author = comment
      .querySelector(".comment-author, .comment-header div:first-child")
      .textContent
      .trim();

    const text = comment
      .querySelector(".comment-text")
      .textContent
      .trim();

    placeholderText.value = `> ${author}: ${text}\n\n`;
    placeholderText.focus();
  });
</script>
  </script>
</html>
