<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    const button = document.querySelector(".add-form-button");
    const placeholderText = document.querySelector(".add-form-text");
    const placeholderName = document.querySelector(".add-form-name");
    const comments = document.querySelector(".comments");
  

    button.addEventListener("click", () => {
      if (placeholderName.value ==="" || placeholderText.value ==="") {
        return;
        
      }
      const now = new Date();
      const day = String(now.getDate()).padStart(2,"0");
      const month = String(now.getMonth()+1).padStart(2,"0");
      const fullYear = now.getFullYear();
      const shortYear = String(fullYear).slice(-2);
      const hours = String(now.getHours()).padStart(2,"0");
      const minutes = String(now.getMinutes()).padStart(2,"0");
      const formatedDate = `${day}.${month}.${shortYear} ${hours}:${minutes}`;
      
      const oldHtml = comments.innerHTML;

      comments.innerHTML = oldHtml + `
        <li class="comment">
          <div class="comment-header">
            <div>${placeholderName.value}</div>
            <div>${formatedDate}</div>
          </div>

          <div class="comment-body">
            <div class="comment-text">
              ${placeholderText.value}
            </div>
          </div>

          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">0</span>
              <button class="like-button "></button>
            </div>
          </div>
        </li>`;
      placeholderName.value ="";
      placeholderText.value ="";
    });

 comments.addEventListener("click", (event) => {
  if (event.target.classList.contains("like-button")) {
    const isLiked = event.target.classList.toggle("-active-like");
    const counter = event.target.previousElementSibling;
    const currentCount = Number(counter.textContent);

    if (isLiked) {
      counter.textContent = currentCount + 1;
    } else {
      counter.textContent = currentCount - 1;
    }
  }
});
  </script>
</html>
